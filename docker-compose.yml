# Development: docker compose up
# Host ports are shifted from the usual ones (5174, 3001, 27018, 8026) so this stack can run
# next to Tornei's development stack.
services:
  mongo:
    image: mongo:8
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/windfinder
      BETTER_AUTH_URL: http://localhost:5174
      # Development-only fallback; production requires a real secret in .env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-not-for-production-0123456789}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Wind Finder <no-reply@windfinder.local>
    ports:
      - '3001:3000'
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    depends_on:
      - mongo
      - mailpit

  # Catches every email the app sends: read them at http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:8026:8025'

  client:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://server:3000
      VITE_USE_POLLING: 'true'
    ports:
      - '5174:5173'
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    depends_on:
      - server

volumes:
  mongo-data:
